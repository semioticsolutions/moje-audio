<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Moje Audio"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"><title>Moje Audio</title></head>
<body><main><header><h1>Moje Audio</h1><p>Prywatna biblioteka MP3 i MP4</p></header><section class="panel"><label class="add">+ Dodaj nagrania<input id="files" type="file" multiple accept=".mp3,.mp4,audio/mpeg,video/mp4" hidden></label><p id="notice" role="status">Pliki pozostają na tym urządzeniu. Zachowaj oryginały jako kopię bezpieczeństwa.</p><p id="storage">Pamięć: sprawdzanie...</p></section><section class="panel"><h2>Biblioteka</h2><div id="library"><p>Nie masz jeszcze nagrań.</p></div></section><section class="panel player"><h2 id="title">Nie wybrano nagrania</h2><audio id="audio" preload="metadata"></audio><div class="buttons"><button id="back" disabled>-15 s</button><button id="toggle" disabled>Odtwórz</button><button id="forward" disabled>+30 s</button></div><input id="seek" aria-label="Pozycja odtwarzania" type="range" min="0" max="100" value="0" disabled><div class="timings"><span id="elapsed">00:00</span><span id="duration">00:00</span></div><label>Prędkość <select id="speed"><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option></select></label></section><footer>Wersja testowa • Offline po pierwszym załadowaniu</footer></main><script src="./app.js" defer></script></body></html>
